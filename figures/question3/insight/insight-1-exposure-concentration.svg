  <g id="text_35">
   <text style="font-weight: 600; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #162335" x="18" y="34.716562" transform="rotate(-0 18 34.716562)">AI exposure is a high-skill story: Zones 4–5 account for 77%</text>

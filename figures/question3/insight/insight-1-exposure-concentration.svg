  <g id="text_37">
   <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667080" x="18" y="500.112" transform="rotate(-0 18 500.112)">Core insight: higher-complexity work is both more typically exposed and responsible for most observed AI use; Zone 4 leads because of computing occupations.</text>
